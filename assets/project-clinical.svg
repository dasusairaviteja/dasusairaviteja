<svg xmlns="http://www.w3.org/2000/svg" width="960" height="332" viewBox="0 0 960 332" role="img" aria-label="project-clinical"><defs><radialGradient id="glow"><stop stop-color="#451126"/><stop offset="1" stop-color="#10070c"/></radialGradient></defs><rect x="1" y="1" width="958" height="330" rx="10" fill="url(#glow)" stroke="#542336"/><text x="34" y="40" fill="#c77b9b" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">02 / AGENTIC RESEARCH</text><text x="34" y="93" fill="#f8f0f3" font-family="Georgia, serif" font-size="44" >Clinical Trial Investigator</text><text x="34" y="134" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="19" >Synthetic patient evidence organized against trial criteria.</text><text x="34" y="164" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="19" >Evidence-linked findings and missing-information checklists.</text><text x="34" y="212" fill="#c77b9b" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">RESEARCH PROTOTYPE</text><rect x="34" y="234" width="72" height="27" rx="13" fill="#29111e" stroke="#653048"/><text x="46" y="252" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="13" >Python</text><rect x="115" y="234" width="88" height="27" rx="13" fill="#29111e" stroke="#653048"/><text x="127" y="252" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="13" >Tool use</text><rect x="212" y="234" width="104" height="27" rx="13" fill="#29111e" stroke="#653048"/><text x="224" y="252" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="13" >Evaluation</text><rect x="325" y="234" width="120" height="27" rx="13" fill="#29111e" stroke="#653048"/><text x="337" y="252" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="13" >Human review</text><text x="34" y="304" fill="#e5b5c7" font-family="Arial, sans-serif" font-size="15" >Synthetic data only. Does not determine clinical eligibility.</text><rect x="762" y="52" width="140" height="39" rx="5" fill="#29111e" stroke="#653048"/><path