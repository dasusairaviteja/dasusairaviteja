<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Sai Ravi Teja Dasu — AI and software engineering</title>
<desc id="desc">Burgundy banner with an abstract orbital network. Agentic AI, evidence-backed workflows, and machine learning systems.</desc>
<defs>
 <linearGradient id="sai-bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#21262d"/></linearGradient>
 <linearGradient id="sai-line"><stop stop-color="#30363d"/><stop offset="0.5" stop-color="#c9d1d9"/><stop offset="1" stop-color="#30363d"/></linearGradient>
 <pattern id="sai-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1200" height="460" rx="20" fill="url(#sai-bg)"/>
<rect width="1200" height="460" rx="20" fill="url(#sai-grid)"/>
<g fill="none" stroke="#58a6ff">
 <circle cx="1000" cy="220" r="155" opacity=".22"/>
 <circle cx="1000" cy="220" r="112" opacity=".35"/>
 <ellipse cx="1000" cy="220" rx="170" ry="65" transform="rotate(-40 1000 220)" opacity=".5"/>
 <path d="M850 305L933 146L1080 177L1060 320L850 305L1080 177" opacity=".35"/>
</g>
<g fill="#c9d1d9"><circle cx="933" cy="146" r="5"/><circle cx="1080" cy="177" r="5"/><circle cx="1060" cy="320" r="5"/><circle cx="850" cy="305" r="5"/></g>
<circle cx="1000" cy="220" r="14" fill="#58a6ff" opacity=".7"><animate attributeName="opacity" values=".7;.3;.7" dur="7s" repeatCount="indefinite"/></circle>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="64" y="76" fill="#c9d1d9" font-size="15" letter-spacing="4">DASUSAIRAVITEJA / ENGINEERING</text>
 <text x="60" y="174" fill="#f0f6fc" font-size="62" font-weight="700">Sai Ravi Teja</text>
 <text x="64" y="225" fill="#c9d1d9" font-size="36">Dasu</text>
 <text x="64" y="289" fill="#f0f6fc" font-size="21">Lead Forward Deployed AI Engineer</text>
 <text x="64" y="330" fill="#c9d1d9" font-size="17">Agentic AI · Evidence-backed workflows · ML systems</text>
 <text x="64" y="414" fill="#58a6ff" font-size="13" letter-spacing="2">BUILD WITH INTENT. VALIDATE WITH EVIDENCE.</text>
</g>
<path d="M64 365H740" stroke="url(#sai-line)" stroke-width="2"/>
<path d="M64 365H740" stroke="#f0f6fc" stroke-width="2" stroke-dasharray="35 641" opacity=".6"><animate attributeName="stroke-dashoffset" values="676;0" dur="9s" repeatCount="indefinite"/></path>
</svg>