name: Refresh profile contributions
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/activity.py'
permissions:
  contents: write
concurrency:
  group: profile-contributions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dasusairaviteja
          outputs: |
            assets/contribution-snake.svg?color_snake=#E5B5C7&color_dots=#190B12,#451126,#701A3D,#C77B9B,#E5B5C7
      - name: Generate contribution summary
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: dasusairaviteja
        run: python3 scripts/activity.py
      - name: Publish generated activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh genuine profile activity"
          git pull --rebase origin main
          git push origin HEAD:main
